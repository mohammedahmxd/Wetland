services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: wetland
      POSTGRES_PASSWORD: local-development-only
      POSTGRES_DB: wetland
    ports: ['127.0.0.1:55432:5432']
    volumes: [wetland-db:/var/lib/postgresql/data]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U wetland']
      interval: 2s
      timeout: 2s
      retries: 20
volumes:
  wetland-db:
