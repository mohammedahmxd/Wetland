# Build and verify only. Deploy separately with an explicitly selected identity/auth mode.
substitutions:
  _PACKAGE: growth-kpi
  _SERVICE: wetland-growth-kpi-demo
  _REGION: northamerica-northeast2
steps:
  - name: node:22-alpine
    entrypoint: sh
    args: ['-c', 'npm ci --ignore-scripts --prefix packages/mcp-runtime && npm ci --ignore-scripts --prefix services/${_PACKAGE} && npm test --prefix packages/mcp-runtime && npm test --prefix services/${_PACKAGE}']
  - name: gcr.io/cloud-builders/docker
    args: ['build', '-f', 'services/${_PACKAGE}/Dockerfile', '-t', '${_REGION}-docker.pkg.dev/$PROJECT_ID/web/${_SERVICE}:$BUILD_ID', '.']
images: ['${_REGION}-docker.pkg.dev/$PROJECT_ID/web/${_SERVICE}:$BUILD_ID']
options:
  logging: CLOUD_LOGGING_ONLY
timeout: 900s
