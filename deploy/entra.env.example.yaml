# Non-secret configuration. Replace every placeholder before deployment.
# Entra v2 API audience is the API application's client UUID, not api://... .
PUBLIC_BASE_URL: "https://YOUR_SERVICE_URL"
MCP_AUTH_MODE: "entra"
MCP_DEMO_UI: "false"
ENTRA_TENANT_ID: "YOUR_TENANT_UUID"
ENTRA_API_CLIENT_ID: "YOUR_API_APPLICATION_UUID"
ENTRA_REQUIRED_SCOPE: "Reports.Read"
ENTRA_ALLOWED_CLIENT_IDS: "YOUR_COPILOT_CONNECTOR_CLIENT_UUID"
