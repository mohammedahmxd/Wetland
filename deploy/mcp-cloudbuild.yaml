# Bootstrap recipe for an explicitly configured service; does not configure MCP authentication.
# For existing services prefer copilot-build.yaml + release.mjs (preserves all configuration).
# Run from repository root; explicit, separately authorized build/runtime identities required.
substitutions:
  _PACKAGE: growth-kpi
  _SERVICE: wetland-growth-kpi
  _REGION: northamerica-northeast2
  _RUNTIME_SA: REQUIRED
  _BUILD_SA: REQUIRED
  _PUBLIC_BASE_URL: REQUIRED
steps:
  - name: node:22-alpine
    dir: packages/mcp-runtime
    entrypoint: npm
    args: ['ci', '--ignore-scripts']
  - name: node:22-alpine
    dir: services/${_PACKAGE}
    entrypoint: npm
    args: ['ci', '--ignore-scripts']
  - name: node:22-alpine
    dir: services/${_PACKAGE}
    entrypoint: sh
    args: ['-c', 'apk add --no-cache python3 py3-reportlab py3-pypdf py3-pillow poppler-utils && REPORT_RENDER_TESTS=true npm test']
  - name: node:22-alpine
    dir: packages/mcp-runtime
    entrypoint: npm
    args: ['test']
  - name: gcr.io/cloud-builders/docker
    args: ['build', '-f', 'services/${_PACKAGE}/Dockerfile', '-t', '${_REGION}-docker.pkg.dev/$PROJECT_ID/web/${_SERVICE}:$BUILD_ID', '.']
  - name: gcr.io/cloud-builders/docker
    args: ['push', '${_REGION}-docker.pkg.dev/$PROJECT_ID/web/${_SERVICE}:$BUILD_ID']
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args: ['run', 'deploy', '${_SERVICE}', '--project=$PROJECT_ID', '--region=${_REGION}', '--image=${_REGION}-docker.pkg.dev/$PROJECT_ID/web/${_SERVICE}:$BUILD_ID', '--service-account=${_RUNTIME_SA}', '--update-env-vars=PUBLIC_BASE_URL=${_PUBLIC_BASE_URL}', '--port=8080', '--min-instances=0', '--max-instances=2', '--memory=512Mi', '--concurrency=2', '--timeout=120', '--quiet']
images: ['${_REGION}-docker.pkg.dev/$PROJECT_ID/web/${_SERVICE}:$BUILD_ID']
serviceAccount: projects/$PROJECT_ID/serviceAccounts/${_BUILD_SA}
options:
  logging: CLOUD_LOGGING_ONLY
